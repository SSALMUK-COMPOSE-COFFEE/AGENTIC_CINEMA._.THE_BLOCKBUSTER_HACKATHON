server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /media/ {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
