services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: shot-memory-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-shotmem}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-shotmem}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-shot_memory}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: shot-memory-api
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: shot-memory-web
    ports:
      - "127.0.0.1:18091:80"
    depends_on:
      - api
    restart: unless-stopped
