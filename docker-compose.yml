services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: shot-memory-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-shotmem}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-shotmem}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-shot_memory}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
